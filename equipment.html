<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equipment - Copenhagen Marathon</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="screen">
  <header></header>
  <main class="body">
    <section class="map">
      <div class="map-content">
        <img class="map-drawing" src="images/map-equipment.svg" alt="">
        <div class="you" style="left: 407px; top: 337px;"></div>
        <div class="pin big" style="left: 675px; top: 300px;">
          <img src="images/icon-shoe.svg" alt="Equipment">
        </div>

        <!-- only visible when "Show all locations" is on -->
        <a class="pin extra" href="water.html"              style="left: 420px; top: 170px;"><img src="images/icon-droplet.svg" alt="Water station"></a>
        <a class="pin extra" href="water.html"              style="left: 560px; top: 470px;"><img src="images/icon-droplet.svg" alt="Water station"></a>
        <a class="pin extra" href="toilet.html"             style="left: 250px; top: 320px;"><img src="images/icon-toilet.svg"  alt="Toilets"></a>
        <a class="pin extra" href="toilet.html"             style="left: 330px; top: 540px;"><img src="images/icon-toilet.svg"  alt="Toilets"></a>
        <a class="pin extra" href="firstaid-locations.html" style="left: 150px; top: 470px;"><img src="images/icon-aid.svg"     alt="First aid"></a>
      </div>
      <div class="zoom">
        <button id="zoom-in"  title="Zoom in">+</button>
        <button id="zoom-out" title="Zoom out">−</button>
        <button id="recenter" title="Back to my location">◎</button>
      </div>

      <!-- switch: ON = the other places appear on this map -->
      <label class="toggle">
        <input type="checkbox">
        <span class="switch"></span>
        Show all locations
      </label>
    </section>

    <aside class="panel">
      <a class="button back go-back" href="all-locations.html"><img src="images/icon-back.svg" alt=""> Back</a>

      <div class="heading">
        <h1>Equipment</h1>
        <p>3 km left</p>
      </div>

      <div class="card">
        <h2>In stock at this station</h2>
        <p class="stock-item">Energy gels <span class="status available">Available</span></p>
        <p class="stock-item">Socks <span class="status low">Low stock</span></p>
        <p class="stock-item">Plasters <span class="status available">Available</span></p>
        <p class="stock-item">Water bottles <span class="status out">Out of stock</span></p>
        <a class="button" href="all-locations.html">Check other stations →</a>
      </div>

      <!-- QR -->
      <div class="qr">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=https://copenhagenmarathon.dk" alt="QR code">
      </div>
    </aside>
  </main>
</div>

<script src="js/map.js"></script>
<script src="js/header.js"></script>
</body>
</html>
