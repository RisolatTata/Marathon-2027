<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Equipment – Copenhagen Marathon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="map-page">
<div class="screen">

  <!-- New Header with the weather and timer included -->
  <header>
    <div class="logo">
      <img src="assets/Logo.png" alt="Logo">
      <h2>Copenhagen Marathon</h2> <!-- This is part of the logo don't change -->
    </div>

    <div class="info">
      <div class="info-block">
        <p class="label">Weather</p>
        <p class="value" id="weather">17°C</p>
      </div>
      <div class="info-block">
        <p class="label">Time left</p>
        <p class="value" id="time-left">2h 30min</p>
      </div>
      <a href="Home.html" class="home-button">⌂</a>
    </div>
  </header>


  <!-- BODY -->
  <main class="body">
    <section class="map">
      <div class="map-content">
        <img class="map-drawing" src="images/map-equipment.svg" alt="">
        <div class="you" style="left: 407px; top: 337px;"></div>
        <div class="pin big" style="left: 675px; top: 300px;">
          <img src="images/icon-shoe.svg" alt="Equipment">
        </div>

        <!-- only visible when "Show all locations" is on -->
        <a class="pin extra" href="water.html"              style="left: 420px; top: 170px;"><img src="images/icon-droplet.svg" alt="Water station"></a>
        <a class="pin extra" href="water.html"              style="left: 560px; top: 470px;"><img src="images/icon-droplet.svg" alt="Water station"></a>
        <a class="pin extra" href="toilet.html"             style="left: 250px; top: 320px;"><img src="images/icon-toilet.svg"  alt="Toilets"></a>
        <a class="pin extra" href="toilet.html"             style="left: 330px; top: 540px;"><img src="images/icon-toilet.svg"  alt="Toilets"></a>
        <a class="pin extra" href="firstaid-locations.html" style="left: 150px; top: 470px;"><img src="images/icon-aid.svg"     alt="First aid"></a>
      </div>
      <div class="zoom">
        <button class="square-button" id="zoom-in"  title="Zoom in">+</button>
        <button class="square-button" id="zoom-out" title="Zoom out">−</button>
        <button class="square-button" id="recenter" title="Back to my location">◎</button>
      </div>

      <!-- switch: ON = the other places appear on this map -->
      <label class="toggle">
        <input type="checkbox">
        <span class="switch"></span>
        Show all locations
      </label>
    </section>

    <aside class="panel">

      <a class="button back go-back" href="all-locations.html">
        <img src="images/icon-back.svg" alt=""> Back
      </a>

      <div class="heading">
        <h1>Equipment</h1>
        <p>3 km left</p>
      </div>

      <div class="stock">
        <h2>In stock at this station</h2>

        <div class="stock-item">Energy gels   <span class="status available">Available</span></div>
        <div class="stock-item">Socks         <span class="status low">Low stock</span></div>
        <div class="stock-item">Plasters      <span class="status available">Available</span></div>
        <div class="stock-item">Water bottles <span class="status out">Out of stock</span></div>

        <a class="button" href="all-locations.html">Check other stations →</a>
      </div>

      <!-- QR -->
      <div class="qr">
        <img src="images/qr-code.svg" alt="QR code" width="100" height="100">
      </div>

    </aside>

  </main>
</div>

<script src="js/map.js"></script>
<script src="js/header.js"></script>
</body>
</html>
