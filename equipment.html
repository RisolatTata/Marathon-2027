<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equipment - Copenhagen Marathon</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="screen">
  <header>
    <div class="logo">
      <img src="assets/Logo.png" alt="Logo">
      <h2>Copenhagen Marathon</h2> <!-- This is part of the logo don't change -->
    </div>

    <div class="info">
      <div class="info-block">
        <p class="label">Weather</p>
        <p class="value" id="weather">17°C</p>
      </div>
      <div class="info-block">
        <p class="label">Time left</p>
        <p class="value" id="time-left">2h 30min</p>
      </div>
      <a href="Home.html" class="home-button">⌂</a>
    </div>
  </header>
  <main class="body">
    <section class="map">
      <div class="map-content">
        <img class="map-drawing" src="images/map-equipment.svg" alt="">
        <div class="you"></div>
        <div class="pin big equipment-3">
          <img src="images/icon-shoe.svg" alt="Equipment">
        </div>
      </div>
      <div class="zoom">
        <button id="zoom-in">+</button>
        <button id="zoom-out">−</button>
        <button id="recenter">◎</button>
      </div>

      <a class="toggle" href="all-locations.html">
        <span class="switch"></span>
        Show all locations
      </a>
    </section>

    <aside class="panel">
      <a class="button back go-back" href="all-locations.html"><img src="images/icon-back.svg" alt=""> Back</a>

      <div class="heading">
        <h1>Equipment</h1>
        <p>3 km left</p>
      </div>

      <div class="card">
        <h2>In stock at this station</h2>
        <p class="stock-item">Energy gels <span class="status available">Available</span></p>
        <p class="stock-item">Socks <span class="status low">Low stock</span></p>
        <p class="stock-item">Plasters <span class="status available">Available</span></p>
        <p class="stock-item">Water bottles <span class="status out">Out of stock</span></p>
        <a class="button" href="all-locations.html">Check other stations →</a>
      </div>

      <!-- QR -->
      <div class="qr">
        <img src="images/qr-code.svg" alt="QR code">
      </div>
    </aside>
  </main>
</div>

<script src="js/map.js"></script>
<script src="js/header.js"></script>
</body>
</html>
