<!DOCTYPE html>
<html lang="en" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equipment - Copenhagen Marathon</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="bg"></canvas>
<div class="screen">
  <header>
    <a class="logo" href="Home.html">
      <img src="assets/Logo.png" alt="Logo">
      <h2>Copenhagen Marathon</h2> <!-- This is part of the logo don't change -->
    </a>

    <div class="info">
      <div class="info-block">
        <p class="label">Weather</p>
        <p class="value" id="weather">17°C</p>
      </div>
      <div class="info-block">
        <p class="label">Time left</p>
        <p class="value" id="time-left">2h 30min</p>
      </div>
      <a href="Home.html" class="home-button"><img src="images/icon-home.svg" alt="Home"></a>
    </div>
  </header>
  <main class="body">
    <div class="map">
      <div class="map-content">
        <img class="map-drawing" src="images/map-equipment.svg" alt="">
        <div class="you"></div>
        <div class="pin big equipment-1">
          <img src="images/icon-shoe.svg" alt="Equipment">
        </div>

        <!-- extra pins -->
        <a class="pin extra water-1" href="water.html"><img src="images/icon-droplet.svg" alt="Water station"></a>
        <a class="pin extra water-2" href="water.html"><img src="images/icon-droplet.svg" alt="Water station"></a>
        <a class="pin extra water-3" href="water.html"><img src="images/icon-droplet.svg" alt="Water station"></a>
        <a class="pin extra water-4" href="water.html"><img src="images/icon-droplet.svg" alt="Water station"></a>
        <a class="pin extra toilet-1" href="toilet.html"><img src="images/icon-toilet.svg" alt="Toilets"></a>
        <a class="pin extra toilet-2" href="toilet.html"><img src="images/icon-toilet.svg" alt="Toilets"></a>
        <a class="pin extra toilet-3" href="toilet.html"><img src="images/icon-toilet.svg" alt="Toilets"></a>
        <a class="pin extra toilet-4" href="toilet.html"><img src="images/icon-toilet.svg" alt="Toilets"></a>
        <a class="pin extra aid-1" href="emergency.html"><img src="images/icon-aid.svg" alt="First aid"></a>
      </div>
      <div class="zoom">
        <button id="zoom-in"  title="Zoom in">+</button>
        <button id="zoom-out" title="Zoom out">−</button>
        <button id="recenter" title="Back to my location">◎</button>
      </div>

      <!-- show all locations -->
      <label class="toggle">
        <input type="checkbox">
        <span class="switch"></span>
        Show all locations
      </label>
    </div>

    <aside class="panel">
      <a class="button back go-back" href="all-locations.html"><img src="images/icon-back.svg" alt=""> Back</a>

      <div class="heading">
        <h1>Equipment</h1>
        <p>5 km left</p>
      </div>

      <div class="card">
        <h2>In stock at this station</h2>
        <p class="stock-item">Energy gels <span class="status available">Available</span></p>
        <p class="stock-item">Socks <span class="status low">Low stock</span></p>
        <p class="stock-item">Plasters <span class="status available">Available</span></p>
        <p class="stock-item">Water bottles <span class="status out">Out of stock</span></p>
      </div>

      <!-- QR -->
      <div class="qr">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=https://copenhagenmarathon.dk" alt="QR code">
      </div>
    </aside>
  </main>
</div>

<script src="js/map.js"></script>
<script src="js/qr-watch.js"></script>
<script src="js/lang.js"></script>
<script src="js/header.js"></script>
<script src="js/bg-animation.js"></script>
</body>
</html>
