<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate"> <!-- stop Chrome auto-translate, we have our own EN/DK -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Water station - Copenhagen Marathon</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <canvas id="bg"></canvas>
<div class="screen">
  <header>
    <a class="logo" href="Home.html">
      <img src="assets/Logo.png" alt="Logo">
      <h2>Copenhagen Marathon</h2> <!-- This is part of the logo don't change -->
    </a>

    <div class="info">
      <div class="info-block">
        <p class="label">Weather</p>
        <p class="value" id="weather">17°C</p>
      </div>
      <div class="info-block">
        <p class="label">Time left</p>
        <p class="value" id="time-left">2h 30min</p>
      </div>
      <a href="Home.html" class="home-button"><img src="images/icon-home.svg" alt="Home"></a>
    </div>
  </header>
  <main class="body">
    <div class="map">
      <div class="map-content">
        <img class="map-drawing" src="images/map-equipment.svg" alt="">
        <div class="you"></div>
        <!-- letters same as in the list -->
        <div class="pin water-2"><img src="images/icon-droplet.svg" alt="Water station A"><span class="pin-name">A</span></div>
        <div class="pin water-3"><img src="images/icon-droplet.svg" alt="Water station B"><span class="pin-name">B</span></div>
        <div class="pin water-4"><img src="images/icon-droplet.svg" alt="Water station C"><span class="pin-name">C</span></div>
        <div class="pin big water-1"><img src="images/icon-droplet.svg" alt="Water station D"><span class="pin-name">D</span></div>

        <!-- extra pins -->
        <a class="pin extra toilet-1" href="toilet.html"><img src="images/icon-toilet.svg" alt="Toilets"></a>
        <a class="pin extra toilet-2" href="toilet.html"><img src="images/icon-toilet.svg" alt="Toilets"></a>
        <a class="pin extra toilet-3" href="toilet.html"><img src="images/icon-toilet.svg" alt="Toilets"></a>
        <a class="pin extra toilet-4" href="toilet.html"><img src="images/icon-toilet.svg" alt="Toilets"></a>
        <a class="pin extra equipment-1" href="equipment.html"><img src="images/icon-shoe.svg" alt="Equipment"></a>
        <a class="pin extra aid-1" href="emergency.html"><img src="images/icon-aid.svg" alt="First aid"></a>
      </div>
      <div class="zoom">
        <button id="zoom-in"  title="Zoom in">+</button>
        <button id="zoom-out" title="Zoom out">−</button>
        <button id="recenter" title="Back to my location">◎</button>
      </div>

      <!-- show all locations -->
      <label class="toggle">
        <input type="checkbox">
        <span class="switch"></span>
        Show all locations
      </label>
    </div>

    <aside class="panel">
      <a class="button back go-back" href="all-locations.html"><img src="images/icon-back.svg" alt=""> Back</a>

      <div class="heading">
        <h1>Water station</h1>
        <p>2 km left</p>
      </div>

      <div class="card">
        <h2>Wait time</h2>
        <p class="stock-item">Station C (2 km) <span class="status available">~1 min</span></p>
        <p class="stock-item">Station D (2 km) <span class="status out">~10 min</span></p>
        <p class="stock-item">Station B (3 km) <span class="status low">~6 min</span></p>
        <p class="stock-item">Station A (5 km) <span class="status available">~2 min</span></p>
      </div>

      <!-- QR -->
      <div class="qr">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=https://copenhagenmarathon.dk" alt="QR code">
      </div>
    </aside>
  </main>
</div>

<script src="js/map.js"></script>
<script src="js/qr-watch.js"></script>
<script src="js/lang.js"></script>
<script src="js/header.js"></script>
<script src="js/bg-animation.js"></script>
</body>
</html>
