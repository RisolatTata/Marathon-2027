<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Water station - Copenhagen Marathon</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="screen">
  <header>
    <div class="logo">
      <img src="assets/Logo.png" alt="Logo">
      <h2>Copenhagen Marathon</h2> <!-- This is part of the logo don't change -->
    </div>

    <div class="info">
      <div class="info-block">
        <p class="label">Weather</p>
        <p class="value" id="weather">17°C</p>
      </div>
      <div class="info-block">
        <p class="label">Time left</p>
        <p class="value" id="time-left">2h 30min</p>
      </div>
      <a href="Home.html" class="home-button">⌂</a>
    </div>
  </header>
  <main class="body">
    <section class="map">
      <div class="map-content">
        <img class="map-drawing" src="images/map-equipment.svg" alt="">
        <div class="you" style="left: 407px; top: 337px;"></div>
        <div class="pin big" style="left: 675px; top: 300px;">
          <img src="images/icon-droplet.svg" alt="Water station">
        </div>
      </div>
      <div class="zoom">
        <button id="zoom-in"  title="Zoom in">+</button>
        <button id="zoom-out" title="Zoom out">−</button>
        <button id="recenter" title="Back to my location">◎</button>
      </div>

      <!-- goes to the map with all locations -->
      <a class="toggle" href="all-locations.html">
        <span class="switch"></span>
        Show all locations
      </a>
    </section>

    <aside class="panel">
      <a class="button back go-back" href="all-locations.html"><img src="images/icon-back.svg" alt=""> Back</a>

      <div class="heading">
        <h1>Water station</h1>
        <p>2 km left</p>
      </div>

      <div class="card">
        <h2>Wait time</h2>
        <p class="stock-item">Station A <span class="status available">~2 min</span></p>
        <p class="stock-item">Station B <span class="status low">~6 min</span></p>
      </div>

      <!-- QR -->
      <div class="qr">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=https://copenhagenmarathon.dk" alt="QR code">
      </div>
    </aside>
  </main>
</div>

<script src="js/map.js"></script>
<script src="js/header.js"></script>
</body>
</html>
