<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Water</title>
  <link rel="stylesheet" href="mystyle.css">
  <link rel="stylesheet" href="css/header.css">
</head>
<body>
  <!-- New Header with the weather and timer included -->
  <header>
    <div class="logo">
      <img src="assets/Logo.png" alt="Logo">
      <h2>Copenhagen Marathon</h2>
    </div>

    <div class="info">
      <div class="info-block">
        <p class="label">Weather</p>
        <p class="value" id="weather">17°C</p>
      </div>
      <div class="info-block">
        <p class="label">Time left</p>
        <p class="value" id="time-left">2h 30min</p>
      </div>
      <a href="Home.html" class="home-button">⌂</a>
    </div>
  </header>

  <script src="js/header.js"></script>
</body>
</html>
