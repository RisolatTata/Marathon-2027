<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Copenhagen Marathon</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
      <div class="logo">
        <img src="assets/Logo.png" alt="Logo">
        <h2>Copenhagen Marathon</h2> <!--Part of logo, do not change-->
      </div>

      <div class="info">
        <div class="info-block">
          <p class="label">Weather</p>
          <p class="value" id="weather">☀ 17°C</p>
        </div>
        <div class="info-block">
          <p class="label">Time left</p>
          <p class="value">2h 30min</p>
        </div>
    </header>

    <main class="hero">
      <h1 class="hero__logo">
        <img src="assets/FullLogo.png" alt="Copenhagen Marathon" width="420" height="90">
      </h1>

      <div class="actions">
        <a class="btn btn--primary" href="#location">
          <svg class="btn__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
          Find location
        </a>
        <a class="btn btn--secondary" href="#map">
          <svg class="btn__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
          Open map
        </a>
      </div>
    </main>

    <div class="lang" role="group" aria-label="Language">
      <button class="lang__btn is-active" type="button" aria-pressed="true">EN</button>
      <button class="lang__btn" type="button" aria-pressed="false">DA</button>
    </div>

  </div>
  <script src="js/header.js"></script>
=======
</body>
</html>
