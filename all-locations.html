<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All locations - Copenhagen Marathon</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="screen">
  <header>
    <div class="logo">
      <img src="assets/Logo.png" alt="Logo">
      <h2>Copenhagen Marathon</h2> <!-- This is part of the logo don't change -->
    </div>

    <div class="info">
      <div class="info-block">
        <p class="label">Weather</p>
        <p class="value" id="weather">17°C</p>
      </div>
      <div class="info-block">
        <p class="label">Time left</p>
        <p class="value" id="time-left">2h 30min</p>
      </div>
      <a href="Home.html" class="home-button">⌂</a>
    </div>
  </header>


  <!--  BODY  -->
  <main class="body">
    <section class="map">
      <div class="map-content">
        <img class="map-drawing" src="images/map-all-locations.svg" alt="">
        <div class="you" style="left: 407px; top: 337px;"></div>

        <a class="pin" href="water.html" style="left: 420px; top: 170px;"><img src="images/icon-droplet.svg" alt="Water station"></a>
        <a class="pin" href="water.html" style="left: 560px; top: 470px;"><img src="images/icon-droplet.svg" alt="Water station"></a>
        <a class="pin" href="toilet.html" style="left: 250px; top: 320px;"><img src="images/icon-toilet.svg" alt="Toilets"></a>
        <a class="pin" href="toilet.html" style="left: 330px; top: 540px;"><img src="images/icon-toilet.svg" alt="Toilets"></a>
        <a class="pin" href="equipment.html" style="left: 640px; top: 260px;"><img src="images/icon-shoe.svg" alt="Equipment"></a>
        <a class="pin" href="firstaid-locations.html" style="left: 150px; top: 470px;"><img src="images/icon-aid.svg" alt="First aid"></a>
      </div>

      <div class="zoom">
        <button id="zoom-in">+</button>
        <button id="zoom-out">−</button>
        <button id="recenter">◎</button>
      </div>

      <!--click goes back to the previous screen -->
      <a class="toggle go-back" href="equipment.html">
        <span class="switch on"></span>
        Show all locations
      </a>
    </section>

    <!-- PANEL (right)-->
    <aside class="panel">
      <a class="button back go-back" href="Menu.html"><img src="images/icon-back.svg" alt=""> Back</a>

      <div class="heading">
        <h1>All locations</h1>
        <p>Tap a place to get directions</p>
      </div>

      <ul class="list">
        <li><a class="row" href="water.html"><span class="circle"><img src="images/icon-droplet.svg" alt=""></span><span class="name">Water station</span>2 km →</a></li>
        <li><a class="row" href="toilet.html"><span class="circle"><img src="images/icon-toilet.svg" alt=""></span><span class="name">Toilets</span>1 km →</a></li>
        <li><a class="row" href="equipment.html"><span class="circle"><img src="images/icon-shoe.svg" alt=""></span><span class="name">Equipment</span>3 km →</a></li>
        <li><a class="row" href="firstaid-locations.html"><span class="circle"><img src="images/icon-aid.svg" alt=""></span><span class="name">First aid</span>5 m →</a></li>
      </ul>
    </aside>
  </main>
</div>

<script src="js/map.js"></script>
<script src="js/header.js"></script>
</body>
</html>
