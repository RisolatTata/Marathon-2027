<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All locations - Copenhagen Marathon</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
  body { margin: 0; }
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; }
</style>
</head>
<body>
  <canvas id="bg"></canvas>
<div class="screen">
  <header>
    <div class="logo">
      <img src="assets/Logo.png" alt="Logo">
      <h2>Copenhagen Marathon</h2> <!-- This is part of the logo don't change -->
    </div>

    <div class="info">
      <div class="info-block">
        <p class="label">Weather</p>
        <p class="value" id="weather">17°C</p>
      </div>
      <div class="info-block">
        <p class="label">Time left</p>
        <p class="value" id="time-left">2h 30min</p>
      </div>
      <a href="Home.html" class="home-button">⌂</a>
    </div>
  </header>


  <!--  BODY  -->
  <main class="body">
    <section class="map">
      <div class="map-content">
        <img class="map-drawing" src="images/map-all-locations.svg" alt="">
        <div class="you"></div>

        <a class="pin water-1" href="water.html"><img src="images/icon-droplet.svg" alt="Water station"></a>
        <a class="pin water-2" href="water.html"><img src="images/icon-droplet.svg" alt="Water station"></a>
        <a class="pin toilet-1" href="toilet.html"><img src="images/icon-toilet.svg" alt="Toilets"></a>
        <a class="pin toilet-2" href="toilet.html"><img src="images/icon-toilet.svg" alt="Toilets"></a>
        <a class="pin equipment-1" href="equipment.html"><img src="images/icon-shoe.svg" alt="Equipment"></a>
        <a class="pin aid-1" href="firstaid-locations.html"><img src="images/icon-aid.svg" alt="First aid"></a>
      </div>

      <div class="zoom">
        <button id="zoom-in"  title="Zoom in">+</button>
        <button id="zoom-out" title="Zoom out">−</button>
        <button id="recenter" title="Back to my location">◎</button>
      </div>
    </section>

    <!-- PANEL (right)-->
    <aside class="panel">
      <a class="button back go-back" href="Menu.html"><img src="images/icon-back.svg" alt=""> Back</a>

      <div class="heading">
        <h1>All locations</h1>
        <p>Tap a place to get directions</p>
      </div>

      <ul class="list">
        <li><a class="row" href="water.html"><span class="circle"><img src="images/icon-droplet.svg" alt=""></span><span class="name">Water station</span>2 km →</a></li>
        <li><a class="row" href="toilet.html"><span class="circle"><img src="images/icon-toilet.svg" alt=""></span><span class="name">Toilets</span>1 km →</a></li>
        <li><a class="row" href="equipment.html"><span class="circle"><img src="images/icon-shoe.svg" alt=""></span><span class="name">Equipment</span>3 km →</a></li>
        <li><a class="row" href="firstaid-locations.html"><span class="circle"><img src="images/icon-aid.svg" alt=""></span><span class="name">First aid</span>5 m →</a></li>
      </ul>
    </aside>
  </main>
</div>

<script src="js/map.js"></script>
<script src="js/header.js"></script>
<script src="js/bg-animation.js"></script>
</body>
</html>
