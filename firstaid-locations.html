<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>First aid - Copenhagen Marathon</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="screen">
  <header></header>
  <main class="body">
    <section class="map"> <!--MAP-->
      <div class="map-content">
        <img class="map-drawing" src="images/map-all-locations.svg" alt="">
        <div class="you" style="left: 407px; top: 337px;"></div>

        <div class="pin big" style="left: 445px; top: 285px;"><img src="images/icon-aid.svg" alt="First aid"></div>
        <div class="pin" style="left: 150px; top: 470px;"><img src="images/icon-aid.svg" alt="First aid"></div>
        <div class="pin" style="left: 640px; top: 260px;"><img src="images/icon-aid.svg" alt="First aid"></div>

        <a class="pin extra" href="water.html" style="left: 420px; top: 170px;"><img src="images/icon-droplet.svg" alt="Water station"></a>
        <a class="pin extra" href="water.html" style="left: 560px; top: 470px;"><img src="images/icon-droplet.svg" alt="Water station"></a>
        <a class="pin extra" href="toilet.html" style="left: 250px; top: 320px;"><img src="images/icon-toilet.svg" alt="Toilets"></a>
        <a class="pin extra" href="toilet.html" style="left: 330px; top: 540px;"><img src="images/icon-toilet.svg" alt="Toilets"></a>
        <a class="pin extra" href="equipment.html" style="left: 540px; top: 230px;"><img src="images/icon-shoe.svg" alt="Equipment"></a>
      </div>

      <div class="zoom">
        <button id="zoom-in"  title="Zoom in">+</button>
        <button id="zoom-out" title="Zoom out">−</button>
        <button id="recenter" title="Back to my location">◎</button>
      </div>

      <label class="toggle">
        <input type="checkbox">
        <span class="switch"></span>
        Show all locations
      </label>
    </section>

    <aside class="panel">
      <a class="button back" href="Menu.html"><img src="images/icon-back.svg" alt=""> Back</a>

      <div class="heading">
        <h1>First aid</h1>
        <p>5 m left</p>
      </div>

      <div class="card">
        <h2>Details</h2>
        <p>Medical tent right next to you</p>
      </div>

      <a class="sent" href="emergency.html">✓ Location sent to medics</a>
      <p class="note">Help is on the way, about 3 min. Please stay where you are.</p>

      <div class="qr">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=https://copenhagenmarathon.dk" alt="QR code">
      </div>
    </aside>
  </main>
</div>

<script src="js/map.js"></script>
<script src="js/header.js"></script>
</body>
</html>
