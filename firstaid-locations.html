<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Copenhagen Marathon</title>
  <link rel="stylesheet" href="stylefirstaid.css">
</head>
<body>

  <header>
    <div class="logo">
      <img src="assets/Logo.png" alt="Logo">
      <h2>Copenhagen Marathon</h2>
    </div>

    <div class="info">
      <div class="info-block">
        <p class="label">Weather</p>
        <p class="value">17°C</p>
      </div>
      <div class="info-block">
        <p class="label">Time left</p>
        <p class="value">2h 30min</p>
      </div>
      <button class="home-button">⌂</button>
    </div>
  </header>

  <div class="screen">

    <div class="map">
      <iframe src="https://www.google.com/maps?q=Fælledparken,Copenhagen&z=15&output=embed"></iframe>
      <label class="map-button">
        <input type="checkbox">
        Show all locations
      </label>
    </div>

    <div class="panel">

    </div>

  </div>

</body>
</html>
