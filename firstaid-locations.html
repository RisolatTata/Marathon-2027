<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>First aid - Copenhagen Marathon</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="screen">
  <header>
    <div class="logo">
      <img src="assets/Logo.png" alt="Logo">
      <h2>Copenhagen Marathon</h2> <!-- This is part of the logo don't change -->
    </div>

    <div class="info">
      <div class="info-block">
        <p class="label">Weather</p>
        <p class="value" id="weather">17°C</p>
      </div>
      <div class="info-block">
        <p class="label">Time left</p>
        <p class="value" id="time-left">2h 30min</p>
      </div>
      <a href="Home.html" class="home-button">⌂</a>
    </div>

    
  </header>
  <main class="body">
    <section class="map"> <!--MAP-->
      <div class="map-content">
        <img class="map-drawing" src="images/map-all-locations.svg" alt="">
        <div class="you"></div>

        <div class="pin big aid-2"><img src="images/icon-aid.svg" alt="First aid"></div>
        <div class="pin aid-1"><img src="images/icon-aid.svg" alt="First aid"></div>
        <div class="pin aid-3"><img src="images/icon-aid.svg" alt="First aid"></div>

        <a class="pin extra water-1" href="water.html"><img src="images/icon-droplet.svg" alt="Water station"></a>
        <a class="pin extra water-2" href="water.html"><img src="images/icon-droplet.svg" alt="Water station"></a>
        <a class="pin extra toilet-1" href="toilet.html"><img src="images/icon-toilet.svg" alt="Toilets"></a>
        <a class="pin extra toilet-2" href="toilet.html"><img src="images/icon-toilet.svg" alt="Toilets"></a>
        <a class="pin extra equipment-2" href="equipment.html"><img src="images/icon-shoe.svg" alt="Equipment"></a>
      </div>

      <div class="zoom">
        <button id="zoom-in">+</button>
        <button id="zoom-out">−</button>
        <button id="recenter">◎</button>
      </div>

      <label class="toggle">
        <input type="checkbox">
        <span class="switch"></span>
        Show all locations
      </label>
    </section>

    <aside class="panel">
      <a class="button back" href="Menu.html"><img src="images/icon-back.svg" alt=""> Back</a>

      <div class="heading">
        <h1>First aid</h1>
        <p>5 m left</p>
      </div>

      <div class="card">
        <h2>Details</h2>
        <p>Medical tent right next to you</p>
      </div>

      <a class="button sent" href="emergency.html">✓ Location sent to medics</a>
      <p class="note">Help is on the way, about 3 min. Please stay where you are.</p>

      <div class="qr">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=https://copenhagenmarathon.dk" alt="QR code">
      </div>
    </aside>
  </main>
</div>

<script src="js/map.js"></script>
<script src="js/header.js"></script>
</body>
</html>
