<!DOCTYPE html>
<html lang="en" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Copenhagen Marathon</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="home">
  <canvas id="bg"></canvas>

  <header>
    <a class="logo" href="index.html">
      <img src="assets/Logo.png" alt="Logo">
      <h2>Copenhagen Marathon</h2> <!--Part of logo, do not change-->
    </a>

    <div class="info">
      <div class="info-block">
        <p class="label">Weather</p>
        <p class="value">☀ <span id="weather">17°C</span></p>
      </div>
      <div class="info-block">
        <p class="label">Time left</p>
        <p class="value" id="time-left">2h 30min</p>
      </div>
    </div>
  </header>

  <main class="hero">
    <h1><img class="hero-logo" src="assets/logo-name.svg" alt="Copenhagen Marathon"></h1>

    <div class="hero-buttons">
      <a class="button dark" href="Menu.html"><img src="images/icon-pin-white.svg" alt=""> Find location</a>
      <a class="button dark" href="all-locations.html"><img src="images/icon-pin-white.svg" alt=""> Open map</a>
    </div>
  </main>

  <script src="js/lang.js"></script>
  <script src="js/header.js"></script>
  <script src="js/bg-animation.js"></script>
</body>
</html>
