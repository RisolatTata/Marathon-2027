<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate"> <!-- stop Chrome auto-translate, we have our own EN/DK -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emergency - Copenhagen Marathon</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="bg"></canvas>
<div class="screen">
  <header>
    <a class="logo" href="Home.html">
      <img src="assets/Logo.png" alt="Logo">
      <h2>Copenhagen Marathon</h2> <!-- This is part of the logo don't change -->
    </a>

    <div class="info">
      <div class="info-block">
        <p class="label">Weather</p>
        <p class="value" id="weather">17°C</p>
      </div>
      <div class="info-block">
        <p class="label">Time left</p>
        <p class="value" id="time-left">2h 30min</p>
      </div>
      <a href="Home.html" class="home-button"><img src="images/icon-home.svg" alt="Home"></a>
    </div>
  </header>
  <main class="body">
    <div class="map">
      <div class="map-content">
        <img class="map-drawing" src="images/map-equipment.svg" alt="">
        <svg class="route-dash" width="808" height="660" aria-hidden="true">
          <line x1="414" y1="314" x2="590" y2="308"/>
        </svg>
        <div class="you"></div>

        <div class="pin big aid-far"><img src="images/icon-aid.svg" alt="First aid"></div>

        <a class="pin extra water-1" href="water.html"><img src="images/icon-droplet.svg" alt="Water station"></a>
        <a class="pin extra water-2" href="water.html"><img src="images/icon-droplet.svg" alt="Water station"></a>
        <a class="pin extra water-3" href="water.html"><img src="images/icon-droplet.svg" alt="Water station"></a>
        <a class="pin extra water-4" href="water.html"><img src="images/icon-droplet.svg" alt="Water station"></a>
        <a class="pin extra toilet-1" href="toilet.html"><img src="images/icon-toilet.svg" alt="Toilets"></a>
        <a class="pin extra toilet-2" href="toilet.html"><img src="images/icon-toilet.svg" alt="Toilets"></a>
        <a class="pin extra toilet-3" href="toilet.html"><img src="images/icon-toilet.svg" alt="Toilets"></a>
        <a class="pin extra toilet-4" href="toilet.html"><img src="images/icon-toilet.svg" alt="Toilets"></a>
        <a class="pin extra equipment-1" href="equipment.html"><img src="images/icon-shoe.svg" alt="Equipment"></a>
      </div>

      <div class="zoom">
        <button id="zoom-in"  title="Zoom in">+</button>
        <button id="zoom-out" title="Zoom out">−</button>
        <button id="recenter" title="Back to my location">◎</button>
      </div>

      <label class="toggle">
        <input type="checkbox">
        <span class="switch"></span>
        Show all locations
      </label>
    </div>

    <aside class="panel">
      <a class="button back" href="Menu.html"><img src="images/icon-back.svg" alt=""> Back</a>

      <div class="heading">
        <h1>First aid</h1>
        <p>3 km left</p>
      </div>

      <div class="card emergency">
        <h2>In an emergency</h2>
        <p class="call"><span class="call-icon">☎</span> call <strong>112</strong></p>
        <p>Use your own phone and tell them where you are.<br>Your location is in the QR code below.</p>
      </div>

      <!-- qr with location for 112 -->
      <div class="card qr-card">
        <div class="qr-caption">
          <p class="qr-title">Scan for your exact location</p>
          <p>Read it out to the 112 operator</p>
        </div>
        <div class="qr">
          <img src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=https%3A%2F%2Fmaps.google.com%2F%3Fq%3D55.6761%2C12.5683" alt="QR code with your location">
        </div>
      </div>
    </aside>
  </main>
</div>

<script src="js/map.js"></script>
<script src="js/lang.js"></script>
<script src="js/header.js"></script>
<script src="js/bg-animation.js"></script>
</body>
</html>
