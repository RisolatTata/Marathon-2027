<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toilets - Copenhagen Marathon</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
  body { margin: 0; }
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; }
</style>
</head>
<body>
  <canvas id="bg"></canvas>
<div class="screen">
  <header>
    <div class="logo">
      <img src="assets/Logo.png" alt="Logo">
      <h2>Copenhagen Marathon</h2> <!-- This is part of the logo don't change -->
    </div>

    <div class="info">
      <div class="info-block">
        <p class="label">Weather</p>
        <p class="value" id="weather">17°C</p>
      </div>
      <div class="info-block">
        <p class="label">Time left</p>
        <p class="value" id="time-left">2h 30min</p>
      </div>
      <a href="Home.html" class="home-button"><img src="images/icon-home.svg" alt="Home"></a>
    </div>
  </header>
  <main class="body">
    <section class="map">
      <div class="map-content">
        <img class="map-drawing" src="images/map-equipment.svg" alt="">
        <div class="you"></div>
        <!-- letter = name of the toilet in the list (A is the first one after the start) -->
        <div class="pin toilet-2"><img src="images/icon-toilet.svg" alt="Toilet A"><span class="pin-name">A</span></div>
        <div class="pin toilet-3"><img src="images/icon-toilet.svg" alt="Toilet B"><span class="pin-name">B</span></div>
        <div class="pin toilet-4"><img src="images/icon-toilet.svg" alt="Toilet C"><span class="pin-name">C</span></div>
        <div class="pin big toilet-1"><img src="images/icon-toilet.svg" alt="Toilet D"><span class="pin-name">D</span></div>

        <!-- only visible when "Show all locations" is on -->
        <a class="pin extra water-1" href="water.html"><img src="images/icon-droplet.svg" alt="Water station"></a>
        <a class="pin extra water-2" href="water.html"><img src="images/icon-droplet.svg" alt="Water station"></a>
        <a class="pin extra water-3" href="water.html"><img src="images/icon-droplet.svg" alt="Water station"></a>
        <a class="pin extra water-4" href="water.html"><img src="images/icon-droplet.svg" alt="Water station"></a>
        <a class="pin extra equipment-1" href="equipment.html"><img src="images/icon-shoe.svg" alt="Equipment"></a>
        <a class="pin extra aid-1" href="emergency.html"><img src="images/icon-aid.svg" alt="First aid"></a>
        <a class="pin extra aid-2" href="emergency.html"><img src="images/icon-aid.svg" alt="First aid"></a>
        <a class="pin extra aid-3" href="emergency.html"><img src="images/icon-aid.svg" alt="First aid"></a>
      </div>
      <div class="zoom">
        <button id="zoom-in"  title="Zoom in">+</button>
        <button id="zoom-out" title="Zoom out">−</button>
        <button id="recenter" title="Back to my location">◎</button>
      </div>

      <!-- switch: ON = the other places appear on this map -->
      <label class="toggle">
        <input type="checkbox">
        <span class="switch"></span>
        Show all locations
      </label>
    </section>

    <aside class="panel">
      <a class="button back go-back" href="all-locations.html"><img src="images/icon-back.svg" alt=""> Back</a>

      <div class="heading">
        <h1>Toilets</h1>
        <p>1.1 km left</p>
      </div>

      <div class="card">
        <h2>Wait time</h2>
        <p class="stock-item">Toilet A (5 km) <span class="status available">~2 min</span></p>
        <p class="stock-item">Toilet B (3.5 km) <span class="status low">~6 min</span></p>
        <p class="stock-item">Toilet C (4.8 km) <span class="status low">~5 min</span></p>
        <p class="stock-item">Toilet D (1.1 km) <span class="status out">~12 min</span></p>
      </div>

      <!-- QR -->
      <div class="qr">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=https://copenhagenmarathon.dk" alt="QR code">
      </div>
    </aside>
  </main>
</div>

<script src="js/map.js"></script>
<script src="js/header.js"></script>
<script src="js/bg-animation.js"></script>
</body>
</html>
