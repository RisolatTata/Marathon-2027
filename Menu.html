<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <link rel="stylesheet" href="Stylesheet.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/header.css">
</head>
<body>
    <!-- New Header with the weather and timer included -->
    <header>
      <div class="logo">
        <img src="assets/Logo.png" alt="Logo">
        <h2>Copenhagen Marathon</h2>
      </div>

      <div class="info">
        <div class="info-block">
          <p class="label">Weather</p>
          <p class="value" id="weather">17°C</p>
        </div>
        <div class="info-block">
          <p class="label">Time left</p>
          <p class="value" id="time-left">2h 30min</p>
        </div>
        <a href="Home.html" class="home-button">⌂</a>
      </div>
    </header>

    <script src="js/header.js"></script>
</body>
</html>
