<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate"> <!-- stop Chrome auto-translate, we have our own EN/DK -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu - Copenhagen Marathon</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="menu">
  <canvas id="bg"></canvas>
<div class="screen">
  <header>
    <a class="logo" href="Home.html">
      <img src="assets/Logo.png" alt="Logo">
      <h2>Copenhagen Marathon</h2> <!-- This is part of the logo don't change -->
    </a>


    <div class="info">
      <div class="info-block">
        <p class="label">Weather</p>
        <p class="value" id="weather">17°C</p>
      </div>
      <div class="info-block">
        <p class="label">Time left</p>
        <p class="value" id="time-left">2h 30min</p>
      </div>
      <a href="Home.html" class="home-button"><img src="images/icon-home.svg" alt="Home"></a>
    </div>
  </header>

 <main class="menu-content">
      <h1>What do you need?</h1>
      <p class="menu-sub">Pick one and we show the nearest spot.</p>
 
      <div class="options">
        <a class="option" href="water.html">
          <span class="option-icon"><img src="images/icon-droplet.svg" alt=""></span>
          <span>
            <p class="option-title">Water station</p>
            <p class="option-meta">2 km away</p>
          </span>
        </a>
 
        <a class="option" href="toilet.html">
          <span class="option-icon"><img src="images/icon-toilet.svg" alt=""></span>
          <span>
            <p class="option-title">Toilets</p>
            <p class="option-meta">1 km away</p>
          </span>
        </a>
 
        <a class="option" href="equipment.html">
          <span class="option-icon"><img src="images/icon-shoe.svg" alt=""></span>
          <span>
            <p class="option-title">Equipment</p>
            <p class="option-meta">3 km away · see what’s in stock</p>
          </span>
        </a>
 
        <a class="option" href="emergency.html">
          <span class="option-icon"><img src="images/icon-aid.svg" alt=""></span>
          <span>
            <p class="option-title">First aid</p>
            <p class="option-meta">5 m away · send your location to medics</p>
          </span>
        </a>
      </div>
    </main>
</div>
<script src="js/lang.js"></script>
<script src="js/header.js"></script>
<script src="js/bg-animation.js"></script>
</body>
</html>
